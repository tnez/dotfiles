# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Keep command context in scrollback, with nothing on the right.
add_newline = false
format = """\
$hostname${custom.project}$directory\
$git_branch$git_commit$git_status\
$line_break$character\
"""
right_format = ''

[hostname]
ssh_only = false
trim_at = '.'
format = '[\[$hostname\]](dimmed white) '

# Prefix the checkout with its project, including the project/main layout.
# Native directory rendering supplies the checkout name and relative path.
[custom.project]
command = '''
root=$(git rev-parse --show-toplevel 2>/dev/null) || exit 1
common=$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null) \
  || exit 1
primary=${common%/.git}
project=${primary##*/}
if [ "$project" = main ]; then
  parent=${primary%/*}
  project=${parent##*/}
fi
if [ "$project" != "${root##*/}" ]; then
  printf '%s/' "$project"
fi
'''
when = true
shell = ['sh']
format = '[$output]($style)'
style = 'bold cyan'

[directory]
truncation_length = 0
truncate_to_repo = true
format = '[$path]($style)[$read_only]($read_only_style) '

[git_branch]
format = '[$branch]($style) '
only_attached = true

[git_commit]
format = '[@$hash]($style) '
commit_hash_length = 7
only_detached = true

[git_status]
format = '[$all_status$ahead_behind]($style)'
style = 'bold yellow'
conflicted = '=${count} '
staged = '+${count} '
modified = '!${count} '
untracked = '?${count} '
deleted = '✘${count} '
renamed = '»${count} '
typechanged = '~${count} '
stashed = ''
ahead = '↑${count} '
behind = '↓${count} '
diverged = '↑${ahead_count} ↓${behind_count} '

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❯](bold green)'
