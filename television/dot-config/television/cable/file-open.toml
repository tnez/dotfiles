[metadata]
name = "file-open"
description = "Find a file and open it in an editor or default application"
requirements = ["fd", "bat"]

[source]
command = [
  "git rev-parse --is-inside-work-tree >/dev/null 2>&1 && git ls-files --cached --others --exclude-standard || fd -t f -H",
]

[preview]
command = "bat -n --color=always '{}'"
env = { BAT_THEME = "ansi" }

[keybindings]
enter = "confirm_selection"
ctrl-r = "confirm_selection"
ctrl-up = "actions:goto_parent_dir"

[actions.goto_parent_dir]
description = "Re-open file picker in the parent directory"
command = "~/.scripts/tv-file-open.sh"
mode = "execute"
