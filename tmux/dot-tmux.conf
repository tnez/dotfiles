# Additive personal settings; preserve each host's terminal and status setup.
set -g prefix C-Space
bind C-Space send-prefix

set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g extended-keys on
set -g extended-keys-format csi-u

# Preserve Omarchy's h/v splits; add these personal split aliases.
# These replace tmux's default delete-buffer and list-keys bindings.
bind - split-window -v -c "#{pane_current_path}"
bind / split-window -h -c "#{pane_current_path}"

# Keep shared rename and pane-kill actions consistent with Omarchy.
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind x kill-pane

# Retain macOS navigation/session preferences; do not override Omarchy.
if-shell '[ "$(uname -s)" = Darwin ]' {
  unbind C-b
  set -s escape-time 0
  set -g detach-on-destroy off
  set -as terminal-overrides ",xterm*:Tc"
  bind h previous-window
  bind v copy-mode
  bind l next-window
  bind R source-file ~/.tmux.conf \; display "Reloaded!"
  bind -n C-h if -F "#{@pane-is-vim}" "send-keys C-h" "select-pane -L"
  bind -n C-j if -F "#{@pane-is-vim}" "send-keys C-j" "select-pane -D"
  bind -n C-k if -F "#{@pane-is-vim}" "send-keys C-k" "select-pane -U"
  bind -n C-l if -F "#{@pane-is-vim}" "send-keys C-l" "select-pane -R"
  bind -n M-h if -F "#{@pane-is-vim}" "send-keys M-h" "resize-pane -L 3"
  bind -n M-j if -F "#{@pane-is-vim}" "send-keys M-j" "resize-pane -D 3"
  bind -n M-k if -F "#{@pane-is-vim}" "send-keys M-k" "resize-pane -U 3"
  bind -n M-l if -F "#{@pane-is-vim}" "send-keys M-l" "resize-pane -R 3"
}
