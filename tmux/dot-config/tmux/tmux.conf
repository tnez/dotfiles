# Omarchy ships defaults in its installation; this file is the user entrypoint.
# Load defaults first so personal bindings win without a recursive include.
if-shell '[ "$(uname -s)" = Linux ]' {
  if-shell '[ -n "$OMARCHY_PATH" ] &&
    [ -f "$OMARCHY_PATH/config/tmux/tmux.conf" ]' {
    source-file "$OMARCHY_PATH/config/tmux/tmux.conf"
  } {
    if-shell '[ -f "$HOME/.local/share/omarchy/config/tmux/tmux.conf" ]' {
      source-file "$HOME/.local/share/omarchy/config/tmux/tmux.conf"
    } {
      if-shell '[ -f /usr/share/omarchy/config/tmux/tmux.conf ]' {
        source-file /usr/share/omarchy/config/tmux/tmux.conf
      }
    }
  }
}

# Reload this entrypoint on both hosts, including a nondefault XDG config root.
%if #{XDG_CONFIG_HOME}
  bind q source-file "$XDG_CONFIG_HOME/tmux/tmux.conf" \
    \; display "Configuration reloaded"
%else
  bind q source-file "$HOME/.config/tmux/tmux.conf" \
    \; display "Configuration reloaded"
%endif

# Shared personal settings; preserve host terminal setup and Omarchy status.
set -g prefix C-Space
bind C-Space send-prefix
# Fallback for clients that intercept Control-Space (for example, iPadOS).
set -g prefix2 C-b
bind C-b send-prefix -2

set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
# Match Omarchy's Vim-style selection and copy within copy mode.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# Vim-style put; replace previous-window (or a stale review popup).
bind p paste-buffer -p
set -g extended-keys on
set -g extended-keys-format csi-u

# Keep split aliases on both hosts; Omarchy also retains its h split.
# These replace tmux's default delete-buffer and list-keys bindings.
bind - split-window -v -c "#{pane_current_path}"
bind / split-window -h -c "#{pane_current_path}"
# Personal copy-mode mnemonic; intentionally replaces Omarchy's v split.
bind v copy-mode

# Match stock window history and inherit the active pane's working directory.
bind l last-window
bind c new-window -c "#{pane_current_path}"

# Keep shared rename and pane-kill actions consistent with Omarchy.
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind x kill-pane

# A global Pi concierge; inside it, detach only the nested popup client.
bind a if -F '#{==:#{@dotfiles-agent-popup},1}' {
  detach-client
} {
  run-shell -b '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/agent-popup" \
    #{q:socket_path} #{q:client_name} #{q:pane_id}'
}

# smart-splits marks Neovim panes; let the editor handle its internal splits.
bind -n C-h if -F "#{@pane-is-vim}" "send-keys C-h" "select-pane -L"
bind -n C-j if -F "#{@pane-is-vim}" "send-keys C-j" "select-pane -D"
bind -n C-k if -F "#{@pane-is-vim}" "send-keys C-k" "select-pane -U"
bind -n C-l if -F "#{@pane-is-vim}" "send-keys C-l" "select-pane -R"

# Retain macOS navigation/session preferences; do not override Omarchy.
if-shell '[ "$(uname -s)" = Darwin ]' {
  set -s escape-time 0
  set -g detach-on-destroy off
  set -as terminal-overrides ",xterm*:Tc"

  # Match stock Omarchy's status bar using the terminal's ANSI palette.
  # Keep default background/foreground; never pin a terminal theme's RGB values.
  set -g status on
  set -g status-position top
  set -g status-justify left
  set -g status-interval 5
  set -g status-left-length 30
  set -g status-right-length 50
  set -g status-style "bg=default,fg=default"
  set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
  set -g status-right "#[fg=blue]"
  set -ag status-right "#{?pane_in_mode,COPY ,}"
  set -ag status-right "#{?client_prefix,PREFIX ,}"
  set -ag status-right "#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
  set -gw window-status-separator ""
  set -gw window-status-format "#[fg=brightblack] #I:#W "
  set -gw window-status-current-format "#[fg=blue,bold] #I:#W "

  # Retire the old shortcut even when reloading an existing Mac server.
  unbind h
  bind -n M-h if -F "#{@pane-is-vim}" "send-keys M-h" "resize-pane -L 3"
  bind -n M-j if -F "#{@pane-is-vim}" "send-keys M-j" "resize-pane -D 3"
  bind -n M-k if -F "#{@pane-is-vim}" "send-keys M-k" "resize-pane -U 3"
  bind -n M-l if -F "#{@pane-is-vim}" "send-keys M-l" "resize-pane -R 3"
}
