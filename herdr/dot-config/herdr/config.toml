width = "95%"
height = "90%"

[[keys.command]]
key = "prefix+comma"
type = "shell"
command = "$HOME/.scripts/herdr-session.sh plan dottie"
description = "plan agent"

[[keys.command]]
key = "prefix+g"
type = "popup"
